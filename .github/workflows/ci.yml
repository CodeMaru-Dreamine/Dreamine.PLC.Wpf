name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SONAR_PROJECT_KEY: CodeMaru-Dreamine_Dreamine.PLC.Wpf
  SONAR_ORGANIZATION: codemaru-dreamine
  SONAR_PROJECT_VERSION: 1.0.1
  SONAR_SCANNER_VERSION: 11.2.1
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  build-test-analyze:
    name: Build, test, package, and analyze
    runs-on: windows-2025

    steps:
      - name: Check out package
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: src/PLC.Wpf
          fetch-depth: 0

      - name: Check out PLC contracts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: CodeMaru-Dreamine/Dreamine.PLC.Abstractions
          path: src/PLC.Abstractions

      - name: Check out PLC runtime
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: CodeMaru-Dreamine/Dreamine.PLC.Core
          path: src/PLC.Core

      - name: Check out MVVM view models
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: CodeMaru-Dreamine/Dreamine.MVVM.ViewModels
          path: src/ViewModels

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x

      - name: Install SonarScanner
        if: env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        run: dotnet tool install --global dotnet-sonarscanner --version $env:SONAR_SCANNER_VERSION

      - name: Align SonarCloud project settings
        if: env.SONAR_TOKEN != '' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $headers = @{
            Accept = 'application/json'
            Authorization = "Bearer $env:SONAR_TOKEN"
          }
          $encodedProject = [Uri]::EscapeDataString($env:SONAR_PROJECT_KEY)
          $branches = Invoke-RestMethod `
            -Method Get `
            -Uri "https://sonarcloud.io/api/project_branches/list?project=$encodedProject" `
            -Headers $headers
          $currentMain = $branches.branches | Where-Object isMain | Select-Object -First 1
          if ($null -ne $currentMain -and $currentMain.name -ne $env:GITHUB_DEFAULT_BRANCH) {
            $conflictingBranch = $branches.branches |
              Where-Object { -not $_.isMain -and $_.name -eq $env:GITHUB_DEFAULT_BRANCH } |
              Select-Object -First 1
            if ($null -ne $conflictingBranch) {
              Invoke-RestMethod `
                -Method Post `
                -Uri 'https://sonarcloud.io/api/project_branches/delete' `
                -Headers $headers `
                -ContentType 'application/x-www-form-urlencoded' `
                -Body @{
                  project = $env:SONAR_PROJECT_KEY
                  branch = $env:GITHUB_DEFAULT_BRANCH
                } | Out-Null
            }

            Invoke-RestMethod `
              -Method Post `
              -Uri 'https://sonarcloud.io/api/project_branches/rename' `
              -Headers $headers `
              -ContentType 'application/x-www-form-urlencoded' `
              -Body @{
                project = $env:SONAR_PROJECT_KEY
                name = $env:GITHUB_DEFAULT_BRANCH
              } | Out-Null
          }

          Invoke-RestMethod `
            -Method Post `
            -Uri 'https://sonarcloud.io/api/settings/set' `
            -Headers $headers `
            -ContentType 'application/x-www-form-urlencoded' `
            -Body @{
              component = $env:SONAR_PROJECT_KEY
              key = 'sonar.leak.period'
              value = '30'
            } | Out-Null
          Invoke-RestMethod `
            -Method Post `
            -Uri 'https://sonarcloud.io/api/settings/set' `
            -Headers $headers `
            -ContentType 'application/x-www-form-urlencoded' `
            -Body @{
              component = $env:SONAR_PROJECT_KEY
              key = 'sonar.leak.period.type'
              value = 'days'
            } | Out-Null

      - name: Restore
        shell: pwsh
        run: dotnet restore src/PLC.Wpf/tests/Dreamine.PLC.Wpf.Tests/Dreamine.PLC.Wpf.Tests.csproj

      - name: Begin Sonar analysis
        if: env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        run: >
          dotnet sonarscanner begin
          /k:"$env:SONAR_PROJECT_KEY"
          /o:"$env:SONAR_ORGANIZATION"
          /v:"$env:SONAR_PROJECT_VERSION"
          /d:sonar.token="$env:SONAR_TOKEN"
          /d:sonar.projectBaseDir="${{ github.workspace }}\src\PLC.Wpf"
          /d:sonar.scm.provider=git
          /d:sonar.sourceEncoding=UTF-8
          /d:sonar.cs.opencover.reportsPaths="$env:RUNNER_TEMP\TestResults\**\coverage.opencover.xml"
          /d:sonar.cs.vstest.reportsPaths="$env:RUNNER_TEMP\TestResults\**\*.trx"
          /d:sonar.exclusions="**/bin/**,**/obj/**,**/TestResults/**,**/*.png,**/*.ico"
          /d:sonar.coverage.exclusions="tests/**,Views/**"
          /d:sonar.cpd.exclusions="tests/**"

      - name: Build and test
        shell: pwsh
        run: >
          dotnet test
          src/PLC.Wpf/tests/Dreamine.PLC.Wpf.Tests/Dreamine.PLC.Wpf.Tests.csproj
          --no-restore
          --configuration Release
          -m:1
          --collect:"XPlat Code Coverage"
          --settings src/PLC.Wpf/.github/coverlet.runsettings
          --results-directory "$env:RUNNER_TEMP\TestResults"
          --logger "trx;LogFileName=tests.trx"

      - name: Pack
        shell: pwsh
        run: >
          dotnet pack
          src/PLC.Wpf/Dreamine.PLC.Wpf.csproj
          --no-restore
          --configuration Release
          --output "$env:RUNNER_TEMP\packages"

      - name: End Sonar analysis
        if: success() && env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        run: dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
